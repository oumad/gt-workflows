# Single-server nginx config for the prod frontend image.
#
# Two concerns:
#   1. Serve the built React SPA from /usr/share/nginx/html. Any URL that
#      doesn't map to a real file falls back to index.html so deep links
#      like /workflows/abc/files reach the client-side router.
#   2. Reverse-proxy /api/* to the api service so the browser only sees
#      one origin (no CORS, no second port to firewall). The api service
#      stays on the internal docker network — it has no externally-mapped
#      port in the prod compose.
#
# Streaming concerns: the API has an NDJSON streaming endpoint
# (workflow-test runner) and an MCP transport that may stream over SSE.
# proxy_buffering off + a long read timeout keeps those alive without
# nginx chunking them.

server {
    listen 80;
    server_name _;

    # 50 MB max body — matches the api's UPLOAD_ROUTE_RE limit in
    # api/src/index.ts. If we raise that, raise this too.
    client_max_body_size 50M;

    # SPA static assets. nginx serves any file that exists; for anything
    # else (a client-side route like /workflows/xyz), fall back to
    # index.html so the React Router takes over.
    root /usr/share/nginx/html;

    # Long cache for fingerprinted Vite output — the /assets/ folder
    # gets content-hashed filenames so it's safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API reverse proxy. /api/* goes to the internal api service on the
    # docker network. proxy_pass NEEDS the trailing slash to preserve the
    # request path.
    location /api/ {
        proxy_pass http://api:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE / NDJSON streaming friendliness. Without these the workflow
        # test endpoint's progress events arrive in one chunk at the end.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_set_header Connection '';
    }

    # The SPA fallback. Everything that isn't a real file is index.html so
    # React Router can take over.
    location / {
        try_files $uri $uri/ /index.html;
        # index.html itself should never be cached — it embeds asset hashes
        # that need to refresh after every deploy.
        add_header Cache-Control "no-store" always;
    }
}
