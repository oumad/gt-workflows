# Minimal infra-only stack: just Postgres. Use this when you run the api
# natively (e.g. on a Windows host to use a UNC workflow share directly) and
# only need its database close to hand.
#
# Bound to localhost by default so a natively-running api on this box reaches
# it without exposing the DB to the network.
#
# Run from the REPO ROOT:
#   docker compose -f docker-compose-templates/postgres.yml --project-directory . up -d
#   docker compose -f docker-compose-templates/postgres.yml --project-directory . down
#
# Native-api env (point at this container):
#   DATABASE_URL=postgresql://postgres:devpassword@127.0.0.1:5432/coffee_maker
#
# Note: RDP credential testing needs the Linux freerdp + Xvfb toolchain, which
# the api only has inside its Docker image — it is NOT available on a native
# Windows api.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coffee_maker
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d coffee_maker"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
